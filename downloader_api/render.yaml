services:
  - type: web
    name: video-agent-downloader
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      node --version
      npm --version
    startCommand: |
      cd /tmp/bgutil/server
      node build/main.js &
      cd -
      uvicorn app:app --host 0.0.0.0 --port $PORT